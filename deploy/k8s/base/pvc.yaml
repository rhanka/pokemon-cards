apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pokemon-cards-data
  labels:
    app.kubernetes.io/name: pokemon-cards
spec:
  # Provider-neutral name. On OVH BHS5 this is backed by Cinder classic; a
  # source-cluster rollback uses the Scaleway overlay instead. A bound PVC is
  # immutable, so this only applies to a newly restored target volume.
  storageClassName: block-standard
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 4Gi
